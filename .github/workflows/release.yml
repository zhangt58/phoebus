name: Build and publish native installers

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build-macos:
    uses: ./.github/workflows/_build.yml
    with:
      os: macos-15
      upload-artifacts: true
      maven-prepare-args: install -DskipTests -f dependencies/install-jars/pom.xml
      maven-args: install -DskipTests -Djavafx.platform=mac-aarch64 -pl phoebus-product-display -am
      product-directory: phoebus-product-display

  build-windows:
    uses: ./.github/workflows/_build.yml
    with:
      os: windows-2022
      upload-artifacts: true
      maven-prepare-args: install -DskipTests -f dependencies/install-jars/pom.xml
      maven-args: install -DskipTests -Djavafx.platform=win -pl phoebus-product-display -am
      product-directory: phoebus-product-display

  build-linux:
    uses: ./.github/workflows/_build.yml
    with:
      os: ubuntu-24.04
      upload-artifacts: true
      maven-prepare-args: install -DskipTests -f dependencies/install-jars/pom.xml
      maven-args: install -DskipTests -Djavafx.platform=linux -pl phoebus-product-display -am
      product-directory: phoebus-product-display

  package-macos:
    needs: build-macos
    runs-on: macos-15
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Set up Java
      uses: ./.github/actions/setup-java
    - name: Download product archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: Phoebus product macos-15
        path: dist
    - name: Create macOS package
      shell: bash
      run: |
        test "$(uname -m)" = arm64
        mkdir app-input package
        archive="$(find dist -type f -name '*.tar.gz' -print -quit)"
        if [[ -z "$archive" ]]; then
          echo "No product archive found under dist" >&2
          find dist -type f -print
          exit 1
        fi
        tar -xzf "$archive" -C app-input

        main_jar="$(find app-input -type f -name 'product-*.jar' -print -quit)"
        if [[ -z "$main_jar" ]]; then
          echo "No product JAR found in $archive" >&2
          find app-input -type f -print
          exit 1
        fi
        product_dir="$(dirname "$main_jar")"

        icon_source="core/ui/src/main/resources/icons/phoebus-logo.png"
        iconset="CS-Studio.iconset"
        mkdir "$iconset"
        for size in 16 32 128 256 512; do
          sips --resampleHeightWidthMax "$size" "$icon_source" --out "$iconset/icon_${size}x${size}.png" >/dev/null
          sips --padToHeightWidth "$size" "$size" --padColor FFFFFF "$iconset/icon_${size}x${size}.png" >/dev/null
          double_size=$((size * 2))
          sips --resampleHeightWidthMax "$double_size" "$icon_source" --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          sips --padToHeightWidth "$double_size" "$double_size" --padColor FFFFFF "$iconset/icon_${size}x${size}@2x.png" >/dev/null
        done
        iconutil --convert icns "$iconset" --output CS-Studio.icns

        version="${RELEASE_TAG#v}"
        version="${version%%-*}"
        if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){0,2}$ ]]; then
          version=1.0.0
        fi

        jpackage \
          --type pkg \
          --name CS-Studio \
          --app-version "$version" \
          --input "$product_dir" \
          --main-jar "$(basename "$main_jar")" \
          --icon CS-Studio.icns \
          --dest package \
          --mac-package-identifier org.phoebus.csstudio \
          --java-options -Dprism.lcdtext=false \
          --java-options -Dcom.sun.webkit.useHTTP2Loader=false
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
    - name: Archive macOS package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: CS-Studio package macos-15
        path: package/*.pkg
        if-no-files-found: error

  package-windows:
    needs: build-windows
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Set up Java
      uses: ./.github/actions/setup-java
    - name: Download product archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: Phoebus product windows-2022
        path: dist
    - name: Create Windows installer
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path app-input, package | Out-Null
        $archive = Get-ChildItem dist -Recurse -Filter *.tar.gz | Select-Object -First 1
        if (-not $archive) {
          Get-ChildItem dist -Recurse
          throw "No product archive found under dist"
        }
        tar -xzf $archive.FullName -C app-input

        $mainJar = Get-ChildItem app-input -Recurse -Filter product-*.jar | Select-Object -First 1
        if (-not $mainJar) {
          Get-ChildItem app-input -Recurse
          throw "No product JAR found in $($archive.FullName)"
        }

        Add-Type -AssemblyName System.Drawing
        $sourceIcon = [System.Drawing.Image]::FromFile(
          (Resolve-Path 'core/ui/src/main/resources/icons/phoebus-logo.png')
        )
        $iconBitmap = New-Object System.Drawing.Bitmap 256, 256
        $graphics = [System.Drawing.Graphics]::FromImage($iconBitmap)
        $graphics.Clear([System.Drawing.Color]::White)
        $scale = [Math]::Min(256 / $sourceIcon.Width, 256 / $sourceIcon.Height)
        $width = [int]($sourceIcon.Width * $scale)
        $height = [int]($sourceIcon.Height * $scale)
        $graphics.DrawImage($sourceIcon, [int]((256 - $width) / 2), [int]((256 - $height) / 2), $width, $height)
        $icon = [System.Drawing.Icon]::FromHandle($iconBitmap.GetHicon())
        $iconStream = [System.IO.File]::Create((Join-Path $PWD 'CS-Studio.ico'))
        $icon.Save($iconStream)
        $iconStream.Dispose()
        $icon.Dispose()
        $graphics.Dispose()
        $iconBitmap.Dispose()
        $sourceIcon.Dispose()
        $iconPath = Join-Path $PWD 'CS-Studio.ico'

        $version = $env:RELEASE_TAG -replace '^v', ''
        $version = $version.Split('-')[0]
        if ($version -notmatch '^\d+(\.\d+){0,2}$') {
          $version = '1.0.0'
        }

        jpackage `
          --type exe `
          --name CS-Studio `
          --app-version $version `
          --input $mainJar.DirectoryName `
          --main-jar $mainJar.Name `
          --icon $iconPath `
          --dest package `
          --win-menu `
          --win-menu-group CS-Studio `
          --win-shortcut `
          --java-options '-Dcom.sun.webkit.useHTTP2Loader=false'
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
    - name: Archive Windows installer
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: CS-Studio package windows-2022
        path: package/*.exe
        if-no-files-found: error

  package-linux:
    needs: build-linux
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        persist-credentials: false
    - name: Set up Java
      uses: ./.github/actions/setup-java
    - name: Download product archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: Phoebus product ubuntu-24.04
        path: dist
    - name: Create Debian package
      shell: bash
      run: |
        mkdir app-input package
        archive="$(find dist -type f -name '*.tar.gz' -print -quit)"
        if [[ -z "$archive" ]]; then
          echo "No product archive found under dist" >&2
          find dist -type f -print
          exit 1
        fi
        tar -xzf "$archive" -C app-input

        main_jar="$(find app-input -type f -name 'product-*.jar' -print -quit)"
        if [[ -z "$main_jar" ]]; then
          echo "No product JAR found in $archive" >&2
          find app-input -type f -print
          exit 1
        fi
        product_dir="$(dirname "$main_jar")"

        version="${RELEASE_TAG#v}"
        version="${version%%-*}"
        if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){0,2}$ ]]; then
          version=1.0.0
        fi

        jpackage \
          --type deb \
          --name CS-Studio \
          --app-version "$version" \
          --input "$product_dir" \
          --main-jar "$(basename "$main_jar")" \
          --icon core/ui/src/main/resources/icons/phoebus-logo.png \
          --dest package \
          --linux-package-name cs-studio \
          --linux-menu-group Science \
          --linux-shortcut \
          --java-options -Dcom.sun.webkit.useHTTP2Loader=false
        deb="$(find package -type f -name '*.deb' -print -quit)"
        test -n "$deb"
        mv "$deb" "package/CS-Studio-${version}.deb"
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
    - name: Archive Debian package
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: CS-Studio package ubuntu-24.04
        path: package/*.deb
        if-no-files-found: error

  release:
    needs:
      - package-macos
      - package-windows
      - package-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: Phoebus product macos-15
        path: dist
    - name: Download native installers
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: CS-Studio package *
        path: dist
    - name: Upload assets to GitHub Release
      run: find dist -type f \( -name '*.tar.gz' -o -name '*.pkg' -o -name '*.exe' -o -name '*.deb' \) -exec gh release upload "$RELEASE_TAG" '{}' --clobber \;
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
